services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: superman
      POSTGRES_USER: superman
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superman -d superman"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - superman-postgres:/var/lib/postgresql/data

volumes:
  superman-postgres:
